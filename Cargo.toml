[package]
name = "ttfun"
version = "0.3.2"
edition = "2024"
description = "Render text and images to Unicode characters"
repository = "https://github.com/qtfkwk/ttfun"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap-cargo = "0.19.0"
glob = "0.3.4"
image = "0.25.10"
imageproc = "0.27.0"
indexmap = "2.14.2"
owo-colors = "4.4.0"
pager2 = "0.6.5"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_must_use = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
doc_markdown = "allow"
wildcard_imports = "allow"
missing_errors_doc = "allow"

